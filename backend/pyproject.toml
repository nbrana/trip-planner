[project]
name = "nj-trip-planner"
version = "0.1.0"
description = "NJ Transit bus trip planner with walk and park & ride access"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "numpy>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tzdata",
    "gtfs-realtime-bindings>=3.0.0",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
